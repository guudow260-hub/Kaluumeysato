<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#055a73">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalluumeysato">
<title>Kalluumeysato Soomaaliyeed</title>
<style>
:root{--bg:#eaf4f8;--ink:#10252e;--mut:#5d7480;--card:#fff;--pri:#087f8c;--pri2:#055a73;--ok:#19a974;--wa:#e6a700;--bad:#d9362f;--line:#d5e5ec}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:linear-gradient(160deg,#055a73,#0aa0a0);color:#fff;padding:50px 16px 54px;text-align:center;position:relative;overflow:hidden}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:34px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
header h1{margin:0 0 6px;font-size:26px}
header p{margin:0;opacity:.92;font-size:15px}
.lang{position:absolute;top:10px;inset-inline-end:10px;z-index:3;width:auto;background:#ffffff26;color:#fff;border:1px solid #ffffff66;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700}
.lang option{color:#10252e}
nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:9px 10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:#e5f4f6;padding:10px 14px;border-radius:20px;white-space:nowrap;font-weight:700;color:var(--pri2);font-size:14px;cursor:pointer}
nav button:active{background:#cdeaee}
main{max-width:860px;margin:-26px auto 0;padding:0 14px 14px;position:relative;z-index:2}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #0a2a3a14}
h2{margin:0 0 10px;font-size:19px}
small,.mut{color:var(--mut)}
select{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
.loc-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.loc-row button{flex:0 0 auto}
/* hero status */
.hero{border-inline-start:8px solid var(--ok);transition:border-color .3s}
.hero.warn{border-color:var(--wa)}.hero.bad{border-color:var(--bad)}
.hero .row{display:flex;align-items:center;gap:14px}
.badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#e4f7ee;flex:0 0 auto}
.hero.warn .badge{background:#fff3d1}.hero.bad .badge{background:#fde4e2}
.big{font-size:26px;font-weight:900;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:620px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:#f1f9fb;padding:13px;border-radius:14px}
.stat span{font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:20px;margin-top:3px}
.msg{margin-top:14px;padding:13px;border-radius:12px;background:#f1f9fb}
/* boats */
.boats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.boat{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:start;cursor:pointer;font:inherit;color:inherit}
.boat b{display:block}
.boat.on{border-color:var(--pri);background:#e8f7f8}
/* windows */
.win{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#eefaf4;border-inline-start:5px solid var(--ok);margin-top:10px}
.win.warn{background:#fff8e3;border-color:var(--wa)}.win.bad{background:#fdeeed;border-color:var(--bad)}
.win .t{font-weight:800}
/* chart */
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.hr{border-radius:12px;padding:10px 6px;text-align:center;background:#eefaf4;border:2px solid var(--ok)}
.hr.warn{background:#fff8e3;border-color:var(--wa)}
.hr.bad{background:#fdeeed;border-color:var(--bad)}
.hr .tm{font-weight:900;font-size:16px}
.hr .ic{font-size:24px;line-height:1.3}
.hr .lb{font-size:12px;font-weight:800}
.hr .dt{font-size:11px;color:var(--mut);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:13px;font-weight:700}
.legend span{padding:5px 10px;border-radius:20px}
.legend .l0{background:#e4f7ee;color:#0b7a52}.legend .l1{background:#fff3d1;color:#8a6200}.legend .l2{background:#fde4e2;color:#a3231d}
/* days */
.day{background:#f1f9fb;border-radius:14px;padding:13px}
.day .d{font-weight:800}
/* buttons / forms */
button.primary{width:100%;padding:15px;border:0;border-radius:13px;background:var(--pri);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button.primary:active{background:var(--pri2)}
button.ghost{padding:12px 14px;border:1px solid var(--pri);background:#fff;color:var(--pri2);border-radius:12px;font-weight:700;cursor:pointer}
input{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;font-size:16px}
.free{background:linear-gradient(135deg,#fff7de,#ffefb8);border:1px solid #f0d477}
.price{font-size:30px;font-weight:900;color:var(--pri)}
.ad{border:2px dashed #f0a33b;text-align:center}
.ok{background:#e9fff3;border-inline-start:5px solid var(--ok);padding:13px;border-radius:10px;margin-top:10px}
.wr{background:#fff8e3;border-inline-start:5px solid var(--wa);padding:13px;border-radius:10px;margin-top:10px}
.er{background:#fff0f0;border-inline-start:5px solid var(--bad);padding:13px;border-radius:10px;margin-top:10px}
.ussd{background:#101820;color:#63ff9c;padding:13px;border-radius:10px;font-family:monospace;text-align:center;margin:8px 0;direction:ltr}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:10;align-items:center;justify-content:center;padding:18px}
.modalbox{background:#fff;border-radius:18px;padding:20px;max-width:430px;width:100%;max-height:90vh;overflow:auto}
.skel{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
.install{display:none;background:linear-gradient(135deg,#e8f7f8,#d3f0f2);border:2px solid var(--pri)}
.install .row2{display:flex;gap:12px;align-items:center}
.install img{width:56px;height:56px;border-radius:14px}
footer{text-align:center;padding:26px 14px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <select id="langSelect" class="lang" aria-label="Language" onchange="setLang(this.value)">
    <option value="so">Soomaali</option>
    <option value="en">English</option>
    <option value="ar">العربية</option>
    <option value="sw">Kiswahili</option>
  </select>
  <h1 data-i18n="h1"></h1>
  <p data-i18n="sub"></p>
</header>

<nav>
  <button onclick="go('xaalad')" data-i18n="navStatus"></button>
  <button onclick="go('waqtiyo')" data-i18n="navTimes"></button>
  <button onclick="go('saadaal')" data-i18n="navForecast"></button>
  <button onclick="go('goob')" data-i18n="navPlace"></button>
  <button onclick="go('akoon')" data-i18n="navAccount"></button>
  <button id="navPremium" onclick="go('premium')" data-i18n="navPremium"></button>
</nav>

<main>

<section id="install" class="card install">
  <div class="row2"><img src="icon-192.png" alt=""><div><b data-i18n="instTitle"></b><div class="mut" style="font-size:13px" data-i18n="instSub"></div></div></div>
  <button class="primary" style="margin-top:12px" onclick="doInstall()" data-i18n="instBtn"></button>
  <div id="installHelp" class="wr" style="display:none" data-i18n-html="instHelp"></div>
</section>

<section id="goob" class="card">
  <h2 data-i18n="locTitle"></h2>
  <select id="locationSelect" onchange="changeLocation()"></select>
  <div class="loc-row"><small id="updated">—</small><span style="flex:1"></span><button class="ghost" onclick="loadData(true)" data-i18n="refresh"></button></div>
  <div class="loc-row"><small data-i18n="unitLbl"></small><span style="flex:1"></span>
    <select id="unitSelect" onchange="setUnit(this.value)" style="width:auto;padding:8px 12px"><option value="kmh">km/h</option><option value="kn">knots</option></select>
  </div>
</section>

<section class="card">
  <h2 data-i18n="boatsTitle"></h2>
  <div class="boats" id="boats"></div>
  <p class="mut" style="margin:10px 0 0;font-size:13px" data-i18n="boatNote"></p>
</section>

<section id="xaalad" class="card hero skel">
  <div class="row">
    <div class="badge" id="hBadge">⏳</div>
    <div><small><span data-i18n="heroNow"></span> <span id="hPlace">Marka</span></small><div class="big" id="hTitle"></div></div>
  </div>
  <div class="grid g4">
    <div class="stat"><span data-i18n="wind"></span><b id="sWind">—</b></div>
    <div class="stat"><span data-i18n="wave"></span><b id="sWave">—</b></div>
    <div class="stat"><span data-i18n="water"></span><b id="sTemp">—</b></div>
    <div class="stat"><span data-i18n="rain"></span><b id="sRain">—</b></div>
  </div>
  <div class="msg" id="hMsg"></div>
</section>

<section id="waqtiyo" class="card">
  <h2 data-i18n="timesTitle"></h2>
  <div id="windows"></div>
  <h2 style="margin-top:20px;font-size:16px" data-i18n="hourlyTitle"></h2>
  <div class="legend" id="legend"></div>
  <div class="hours" id="chart"></div>
</section>

<section id="saadaal" class="card">
  <h2 data-i18n="fcTitle"></h2>
  <div class="grid" id="days"></div>
</section>

<section class="card">
  <h2 data-i18n="distTitle"></h2>
  <div class="grid" id="dist"></div>
</section>

<section id="freeCard" class="card free">
  <h2 data-i18n="freeTitle"></h2>
  <p data-i18n="freeText"></p>
  <button class="primary" onclick="openModal('register')" data-i18n="regBtn"></button>
  <button class="ghost" style="width:100%;margin-top:8px" onclick="openModal('login')" data-i18n="loginBtn"></button>
</section>

<section id="akoon" class="card">
  <h2 data-i18n="accTitle"></h2>
  <div id="accountStatus"></div>
</section>

<section id="premium" class="card">
  <h2 data-i18n="premTitle"></h2>
  <p data-i18n="premText"></p>
  <div class="price" data-i18n="price"></div>
  <p><small data-i18n="payVia"></small></p>
  <button class="primary" onclick="openModal('pay')" data-i18n="payBtn"></button>
</section>

<section class="card ad">
  <h3 data-i18n="adTitle"></h3>
  <p><b data-i18n="adText"></b></p>
  <small data-i18n="adSub"></small>
</section>

</main>

<footer>
  <span data-i18n="f1"></span><br>
  <span data-i18n="f2"></span><br>
  <b data-i18n="f3"></b>
</footer>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <h2 id="mtitle"></h2>
    <div id="mcontent"></div>
    <button class="primary" onclick="closeModal()" style="margin-top:12px;background:#667c87" data-i18n="close"></button>
  </div>
</div>

function detectLang(){
  const n=(navigator.language||'').slice(0,2).toLowerCase();
  if(n==='so'||n==='ar'||n==='sw')return n;
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  if(tz==='Africa/Mogadishu')return 'so';
  return n==='en'?'en':'so';
}

  let s=I18N[lang]&&I18N[lang][k];
  if(s==null)s=I18N.so[k];
  if(s==null)return k;
  if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);
  return s;
}

    $('hTitle').textContent=t('loading');
    $('hMsg').textContent=t('msgLoading');
    $('windows').innerHTML='<small>'+t('loading')+'</small>';
  }
}
function buildLocations(){
  const sel=$('locationSelect');
  const cur=sel.value||'Marka';
  let h='<option value="__gps__">'+esc(t('gps'))+'</option>';
  GROUPS.forEach(g=>{h+='<optgroup label="'+esc(t(g.k))+'">'+g.n.map(n=>'<option value="'+esc(n)+'">'+esc(placeLabel(n))+'</option>').join('')+'</optgroup>'});
  sel.innerHTML=h;
  sel.value=cur;
  if(sel.value!==cur)sel.value='Marka';
}
function setLang(l){
  if(!I18N[l])return;
  lang=l;safeSet('k_lang',l);
  applyLang();buildLocations();renderBoats();renderDist();loadAccount();
  if(DATA)render();else if(ERR)showError();
}
function setUnit(u){unit=u==='kn'?'kn':'kmh';safeSet('k_unit',unit);renderBoats();if(DATA)render()}

/* ---------- Qiimeynta xaaladda ---------- */
function level(wind,wave,gust){
  const b=BOATS[boat];
  const g=gust||wind;
  if(wind>b.w*1.25||wave>b.h*1.35||g>b.w*1.7) return 2;
  if(wind>b.w||wave>b.h||g>b.w*1.35) return 1;
  return 0;
}
function LVL(i){
  return [
   {cls:"",ic:"🟢",t:t('lvG'),m:t('mG')},
   {cls:"warn",ic:"🟡",t:t('lvC'),m:t('mC')},
   {cls:"bad",ic:"🔴",t:t('lvB'),m:t('mB')}
  ][i];
}

/* ---------- Soo qaadista xogta dhabta ah ---------- */
async function loadData(force){
  const place=$('locationSelect').value;
  const [lat,lon]=LOC[place]||LOC["Marka"];
  $('hPlace').textContent=placeLabel(place);
  $('updated').textContent=t('updating');
  const ck='k_cache_'+place+(place==='__gps__'?'_'+lat+','+lon:'');
  try{
    const f='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&hourly=wind_speed_10m,wind_gusts_10m,precipitation_probability&wind_speed_unit=kmh&timezone=auto&forecast_days=4';
    const m='https://marine-api.open-meteo.com/v1/marine?latitude='+lat+'&longitude='+lon+'&hourly=wave_height,sea_surface_temperature&timezone=auto&forecast_days=4';
    const [a,b]=await Promise.all([fetch(f).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(m).then(r=>r.ok?r.json():null).catch(()=>null)]);
    const h=a.hourly, mh=b&&b.hourly?b.hourly:{};
    const rows=h.time.map((tt,i)=>({
      t:tt, wind:h.wind_speed_10m[i], gust:h.wind_gusts_10m[i], rain:h.precipitation_probability[i],
      wave:mh.wave_height?mh.wave_height[i]:null, sst:mh.sea_surface_temperature?mh.sea_surface_temperature[i]:null
    }));
    DATA={place,rows,ts:Date.now(),hasWave:!!mh.wave_height};
    safeSet(ck,JSON.stringify(DATA));
  }catch(e){
    const c=safeGet(ck);
    if(c){try{DATA=JSON.parse(c)}catch(_){}}
    if(!DATA||DATA.place!==place){DATA=null;showError();return}
  }
  ERR=false;
  render();
}
function showError(){
  ERR=true;
  $('xaalad').classList.remove('skel');
  $('hBadge').textContent="📡";$('hTitle').textContent=t('errTitle');
  $('hMsg').textContent=t('errMsg');
  $('updated').textContent=t('noData');
}

/* ---------- Muujinta ---------- */
function fmtH(tt){return tt.slice(11,16)}
const DAYS_SO=["Axad","Isniin","Talaado","Arbaco","Khamiis","Jimce","Sabti"];
function dayName(d){
  if(lang==='so')return DAYS_SO[d.getDay()];
  try{return d.toLocaleDateString(LOCALE[lang],{weekday:'long'})}catch(e){return DAYS_SO[d.getDay()]}
}
function render(){
  if(!DATA)return;
  const rows=DATA.rows;
  // saacadda ugu dhow hadda
  const now=Date.now();
  let idx=rows.findIndex(r=>new Date(r.t).getTime()>=now-1800000);
  if(idx<0)idx=0;
  // time-zone-ka goobta: Open-Meteo wuxuu siiyaa waqti maxalli ah
  const cur=rows[idx];
  const L=level(cur.wind,cur.wave??0,cur.gust);
  const LVx=LVL(L);
  const hero=$('xaalad');
  hero.classList.remove('skel','warn','bad');
  if(LVx.cls)hero.classList.add(LVx.cls);
  $('hPlace').textContent=placeLabel(DATA.place);
  $('hBadge').textContent=LVx.ic;
  $('hTitle').textContent=LVx.t;
  $('hMsg').innerHTML=LVx.m+(DATA.hasWave?'':'<br><small>'+t('noWave')+'</small>');
  $('sWind').textContent=fw(cur.wind);
  $('sWave').textContent=cur.wave!=null?cur.wave.toFixed(1)+' m':'—';
  $('sTemp').textContent=cur.sst!=null?Math.round(cur.sst)+'°C':'—';
  $('sRain').textContent=(cur.rain??0)+'%';
  $('updated').textContent=t('updated')+' '+new Date(DATA.ts).toLocaleTimeString(LOCALE[lang],{hour:'2-digit',minute:'2-digit'})+' · '+t('src');

  // 24 saac
  const next=rows.slice(idx,idx+24);
  const LB=[t('lbG'),t('lbC'),t('lbB')],IC=['🟢','🟡','🔴'];
  $('chart').innerHTML=next.map(r=>{
    const l=level(r.wind,r.wave??0,r.gust);
    return '<div class="hr '+['','warn','bad'][l]+'"><div class="tm">'+fmtH(r.t)+'</div><div class="ic">'+IC[l]+'</div><div class="lb">'+LB[l]+'</div><div class="dt">🌬️ '+fw(r.wind)+(r.wave!=null?'<br>🌊 '+r.wave.toFixed(1)+' m':'')+'</div></div>';
  }).join('');

  // waqtiyada ugu fiican maanta (05:00–18:00 xaggaas oo hadda ka dambeeya)
  const today=cur.t.slice(0,10);
  const day=rows.filter(r=>r.t.startsWith(today)&&+r.t.slice(11,13)>=5&&+r.t.slice(11,13)<=18&&new Date(r.t).getTime()>=now-3600000);
  $('windows').innerHTML=bestWindows(day);

  // 3 maalmood
  const days=[...new Set(rows.map(r=>r.t.slice(0,10)))].slice(0,3);
  $('days').innerHTML=days.map((d,i)=>{
    const rs=rows.filter(r=>r.t.startsWith(d)&&+r.t.slice(11,13)>=5&&+r.t.slice(11,13)<=18);
    if(!rs.length)return '';
    const lv=rs.map(r=>level(r.wind,r.wave??0,r.gust));
    const good=lv.filter(x=>x===0).length;
    const mw=Math.max(...rs.map(r=>r.wind));
    const mh=DATA.hasWave?Math.max(...rs.map(r=>r.wave||0)).toFixed(1)+' m':'—';
    const nm=i===0?t('today'):i===1?t('tomorrow'):dayName(new Date(d+'T12:00'));
    const lab=good>=8?'🟢 '+t('lbG'):good>=4?'🟡 '+t('lbC'):'🔴 '+t('lbBad');
    const bw=bestWindows(rs,true);
    return '<div class="day"><div class="d">'+nm+'</div><div>'+lab+'</div><small>🌬️ '+t('upTo')+' '+fw(mw)+' · 🌊 '+t('upTo')+' '+mh+'</small><br><small>'+bw+'</small></div>';
  }).join('');
}

function bestWindows(rs,short){
  if(!rs.length)return short?'—':'<div class="win warn"><div>🌙</div><div>'+t('over')+'</div></div>';
  // ka dhex raadi xilliyada isku xigta ee nabdoon
  let best=null,cur=null;
  rs.forEach(r=>{
    const l=level(r.wind,r.wave??0,r.gust);
    if(l===0){ if(!cur)cur={s:r.t,e:r.t,n:1}; else{cur.e=r.t;cur.n++} if(!best||cur.n>best.n)best={...cur}; }
    else cur=null;
  });
  if(!best){
    return short?t('noneShort'):'<div class="win bad"><div>🔴</div><div><div class="t">'+t('noSafe')+'</div><div class="mut">'+t('noSafeSub')+'</div></div></div>';
  }
  const endH=String((+best.e.slice(11,13)+1)%24).padStart(2,'0')+':00';
  const txt=fmtH(best.s)+' – '+endH;
  if(short)return '⏰ '+txt;
  const warnHrs=rs.filter(r=>level(r.wind,r.wave??0,r.gust)===1).map(r=>fmtH(r.t));
  let html='<div class="win"><div style="font-size:26px">🟢</div><div><div class="t">'+txt+'</div><div class="mut">'+t('longest',{n:best.n})+'</div></div></div>';
  if(warnHrs.length)html+='<div class="win warn"><div style="font-size:26px">🟡</div><div><div class="t">'+t('lbC')+'</div><div class="mut">'+t('hoursLbl')+' '+warnHrs.slice(0,6).join(', ')+(warnHrs.length>6?'…':'')+'</div></div></div>';
  return html;
}

function renderBoats(){
  $('boats').innerHTML=Object.entries(BOATS).map(([k,b])=>'<button class="boat '+(k===boat?'on':'')+'" onclick="setBoat(\''+k+'\')"><b>'+b.i+' '+t(b.nk)+'</b><small>'+t('windShort')+': '+t('upTo')+' '+fw(b.w)+' · '+t('waveShort')+': '+t('upTo')+' '+b.h+' m</small></button>').join('');
}
function renderDist(){
  const rows=[['huuri','2–5'],['d15','1–7'],['d60','2–40+']];
  $('dist').innerHTML=rows.map(([k,x])=>'<div class="stat"><b>'+t(BOATS[k].nk)+'</b><span>'+t('distAbout',{x:x})+'</span></div>').join('')+
    '<div class="stat"><b>'+t('bFoolfe')+'</b><span>'+t('dFoolfe')+'</span></div>';
}
function setBoat(k){boat=k;safeSet('k_boat',k);renderBoats();render()}

function changeLocation(){
  const v=$('locationSelect').value;
  if(v==='__gps__'){useGPS();return}
  safeSet('k_goob',v);track('location');DATA=null;ERR=false;$('xaalad').classList.add('skel');loadData();
}
function useGPS(){
  if(!navigator.geolocation){gpsFail();return}
  $('updated').textContent=t('gpsWait');
  navigator.geolocation.getCurrentPosition(p=>{
    LOC.__gps__=[+p.coords.latitude.toFixed(2),+p.coords.longitude.toFixed(2)];
    safeSet('k_gps',JSON.stringify(LOC.__gps__));safeSet('k_goob','__gps__');
    track('location');DATA=null;ERR=false;$('xaalad').classList.add('skel');loadData();
  },()=>gpsFail(),{timeout:12000,maximumAge:600000});
}
function gpsFail(){
  const prev=safeGet('k_goob');
  $('locationSelect').value=(prev&&LOC[prev])?prev:'Marka';
  $('updated').textContent=t('gpsErr');
}

/* ---------- Akoonka (prototype) ---------- */
function normalizePhone(v){return v.replace(/\D/g,'').replace(/^252/,'').replace(/^0/,'')}
async function hashPin(pin,phone){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(phone+':'+pin+':kalluumeysato'));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return btoa(phone+pin)}
}
/* Qofka diiwaangashan: kaarka bilaashka waa la qariyaa, akoonka waa kor loo qaadaa,
   Premium wuxuu muuqdaa kaliya marka bilaashku dhow yahay inuu dhammaado (<=7 maalmood) ama dhammaaday. */
function applyAccountLayout(state,days){
  const reg=state!=='none';
  $('freeCard').style.display=reg?'none':'';
  if(reg)document.querySelector('main').prepend($('akoon'));
  const showPrem=!reg||state==='expired'||days<=7;
  $('premium').style.display=showPrem?'':'none';
  $('navPremium').style.display=showPrem?'':'none';
}
function loadAccount(){
  const u=safeGet('kalluumeysi_user'); const el=$('accountStatus');
  if(!u){el.textContent=t('accNone');applyAccountLayout('none');return;}
  try{
    const x=JSON.parse(u);
    const exp=new Date(x.started); exp.setMonth(exp.getMonth()+3);
    const rem=exp.getTime()-Date.now();
    if(rem>0){
      const d=Math.ceil(rem/86400000);
      el.innerHTML='<div class="ok"><b>'+t('welcome',{name:esc(x.name)})+'</b><p style="margin:6px 0 0">'+t('freeLeft')+'</p><p style="margin:4px 0 0">'+t('timeLeft')+' <b>'+t('daysFmt',{d:d})+'</b></p>'+(d<=7?'<p style="margin:6px 0 0"><b>'+t('endSoon')+'</b> '+t('chooseP')+'</p>':'')+'</div><button class="ghost" style="width:100%;margin-top:10px" onclick="openModal(\'pay\')">'+t('payEarly')+'</button>';
      applyAccountLayout('active',d);
    }else{
      el.innerHTML='<div class="wr"><b>'+t('expired')+'</b><p style="margin:6px 0 0">'+t('expiredSub')+'</p></div>';
      applyAccountLayout('expired',0);
    }
  }catch(e){el.textContent=t('accNone');applyAccountLayout('none');}
}
function openModal(type){
  $('modal').style.display='flex'; const c=$('mcontent');
  if(type==='register'){
    $('mtitle').textContent=t('regTitle');
    c.innerHTML='<p>'+t('regIntro')+'</p><p style="font-size:12px;color:#5d7480">'+t('regPriv')+'</p><input id="regName" placeholder="'+esc(t('pName'))+'" autocomplete="name"><input id="regPhone" placeholder="'+esc(t('pPhone'))+'" inputmode="tel"><input id="regPin" type="password" placeholder="'+esc(t('pPin'))+'" inputmode="numeric" maxlength="6"><input id="regPin2" type="password" placeholder="'+esc(t('pPin2'))+'" inputmode="numeric" maxlength="6"><button class="primary" onclick="registerUser()">'+t('regGo')+'</button><div id="regResult"></div>';
  }else if(type==='login'){
    showLogin();
  }else{
    $('mtitle').textContent=t('payTitle');
    c.innerHTML='<p>'+t('payAmt')+'</p><input id="payPhone" placeholder="'+esc(t('pEvc'))+'" inputmode="tel"><div class="ussd" id="ussdCode">*712*NUMBER*1#</div><button class="primary" onclick="prepareEVC()">'+t('prepBtn')+'</button><div id="payResult"></div>';
  }
}
async function registerUser(){
  const name=$('regName').value.trim(), phone=normalizePhone($('regPhone').value);
  const pin=$('regPin').value.trim(), pin2=$('regPin2').value.trim(), out=$('regResult');
  if(!name||phone.length<9||!/^\d{4,6}$/.test(pin)||pin!==pin2){
    out.innerHTML='<p class="er">'+t('regErr')+'</p>';return;
  }
  if(safeGet('kalluumeysi_registered_phone')===phone){
    out.innerHTML='<div class="wr"><b>'+t('already')+'</b><p>'+t('numLbl')+' ******'+phone.slice(-4)+'</p><p>'+t('noRestart')+'</p><button class="primary" onclick="showLogin()">'+t('loginOld')+'</button></div>';return;
  }
  const ph=await hashPin(pin,phone);
  if(BACKEND){
    try{
      const r=await sb('users',{name:name,phone:phone,pin_hash:ph});
      if(r.status===409){
        out.innerHTML='<div class="wr"><b>'+t('already')+'</b><p>'+t('noRestart')+'</p><button class="primary" onclick="showLogin()">'+t('loginOld')+'</button></div>';return;
      }
      if(!r.ok)throw 0;
    }catch(e){
      out.innerHTML='<p class="er">'+t('regFail')+'</p>';return;
    }
  }
  safeSet('kalluumeysi_registered_phone',phone);
  safeSet('kalluumeysi_user',JSON.stringify({name,phone,pinHash:ph,started:Date.now()}));
  track('register',{phone:phone});
  out.innerHTML='<div class="ok"><b>'+t('regOk')+'</b><p style="margin:6px 0 0">'+t('regOkSub',{name:esc(name)})+'</p></div>';
  loadAccount();
  setTimeout(()=>{closeModal();window.scrollTo({top:0,behavior:'smooth'})},1500);
}
function showLogin(){
  $('mtitle').textContent=t('loginTitle');
  $('mcontent').innerHTML='<input id="loginPhone" placeholder="'+esc(t('pPhone'))+'" inputmode="tel"><input id="loginPin" type="password" placeholder="'+esc(t('pPinLogin'))+'" inputmode="numeric" maxlength="6"><button class="primary" onclick="loginUser()">'+t('loginGo')+'</button><div id="loginResult"></div>';
}
async function loginUser(){
  const phone=normalizePhone($('loginPhone').value), pin=$('loginPin').value, out=$('loginResult');
  let s=null; try{s=JSON.parse(safeGet('kalluumeysi_user')||'null')}catch(e){}
  if(BACKEND){
    try{
      const h=await hashPin(pin,phone);
      const r=await fetch(SB_URL+'/rest/v1/rpc/check_login',{method:'POST',headers:sbHeaders(),body:JSON.stringify({p_phone:phone,p_hash:h})});
      const j=await r.json();
      if(Array.isArray(j)&&j.length){
        safeSet('kalluumeysi_user',JSON.stringify({name:j[0].name,phone:phone,pinHash:h,started:new Date(j[0].started_at).getTime()}));
        out.innerHTML='<div class="ok"><b>'+t('loggedIn')+'</b></div>';loadAccount();setTimeout(()=>{closeModal();window.scrollTo({top:0,behavior:'smooth'})},900);return;
      }
    }catch(e){}
  }
  if(s&&s.phone===phone&&s.pinHash&&s.pinHash===await hashPin(pin,phone)){
    out.innerHTML='<div class="ok"><b>'+t('loggedIn')+'</b></div>'; loadAccount();
    setTimeout(()=>{closeModal();window.scrollTo({top:0,behavior:'smooth'})},900);
  }else{
    out.innerHTML='<p class="er">'+t('loginBad')+'</p>';
  }
}

/* ---------- EVCPlus ---------- */

function openUSSD(code){
  // '#' waa in loo beddelaa %23 si telefoonku u aqoonsado
  location.href='tel:'+code.replace(/#/g,'%23');
}
function closeModal(){$('modal').style.display='none'}

/* ---------- Ku dar shaashadda (PWA) ---------- */
let deferredInstall=null;
const isStandalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstall()});
window.addEventListener('appinstalled',()=>{$('install').style.display='none';deferredInstall=null;track('install')});
function showInstall(){if(isStandalone)return;$('install').style.display='block'}
const UA=navigator.userAgent;
const IN_APP=/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\/|Snapchat|TikTok|MiuiBrowser/i.test(UA);
const IS_ANDROID=/Android/i.test(UA);
function openInChrome(){
  const path=location.host+location.pathname+location.search+location.hash;
  location.href='intent://'+path+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';
}
async function doInstall(){
  /* 1) Chrome: install toos ah */
  if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;$('install').style.display='none';return}
  /* 2) Facebook / Instagram (Android): ku fur Chrome */
  if(IN_APP&&IS_ANDROID){openInChrome();return}
  /* 3) Kuwa kale (iPhone iwm): tilmaamaha gacanta */
  $('installHelp').style.display='block';
}
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller;
  let reloaded=false;
  /* Marka nooc cusub la helo, bogga hal mar dib u soo rar */
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
}
window.addEventListener('load',()=>{if(!isStandalone)setTimeout(showInstall,2500)});

/* ---------- Bilow ---------- */
applyLang();buildLocations();renderBoats();renderDist();loadAccount();
window.addEventListener('load',()=>{
  const v=safeGet('k_goob');
  if(v==='__gps__'){
    try{const g=JSON.parse(safeGet('k_gps')||'null');if(Array.isArray(g)&&g.length===2){LOC.__gps__=g;$('locationSelect').value='__gps__'}}catch(e){}
  }else if(v&&LOC[v])$('locationSelect').value=v;
  loadAccount(); loadData(); track('visit');
  /* App-ka laga furay shaashadda guriga (installed) */
  if(isStandalone)track('app_open');
});
